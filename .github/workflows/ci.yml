name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  website:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm lint
      - uses: actions/upload-artifact@v7
        with:
          name: dejavu-website
          path: dist
